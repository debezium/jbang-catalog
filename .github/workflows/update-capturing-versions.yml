
name: Update Debezium Capturing Versions

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-capturing-versions:
    name: Update Capturing Template Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update capturing template versions
        run: APPLY=1 bash scripts/update-capturing-versions.sh

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            templates/capturing/mysql/capturing.java.qute
            templates/capturing/mongodb/capturing.java.qute
            templates/capturing/postgres/capturing.java.qute
            templates/capturing/sqlserver/capturing.java.qute
            templates/capturing/mariadb/capturing.java.qute
            templates/capturing/mysql/docker-compose.yaml
            templates/capturing/mariadb/docker-compose.yaml
          commit-message: "Update Debezium capturing template versions"
          branch: automation/update-capturing-versions
          delete-branch: true
          title: "Update Debezium capturing template versions"
          body: |
            This PR automatically updates the Debezium Quarkus
            extension versions and available Docker image tags
            used by the JBang capturing templates.

            Generated by the scheduled version update workflow.
