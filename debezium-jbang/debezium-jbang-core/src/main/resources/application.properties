quarkus.log.level=WARN
quarkus.banner.enabled=false
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.compress.compressors.brotli.BrotliCompressorInputStream,--initialize-at-run-time=org.apache.http,--initialize-at-run-time=com.github.luben.zstd
quarkus.native.resources.includes=config-defaults.yaml
quarkus.oras.registries.default.enabled=true
quarkus.oras.registries.default.defaults=true
quarkus.oras.registries.default.devservice=false
# commands are vanilla picocli classes outside ArC and quarkus
quarkus.arc.exclude-types=io.debezium.jbang.core.commands.**